<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 🦫💘</title>
  <!-- Messenger / social preview info -->
<meta property="og:title" content="Be My Valentine 🦫💘" />
<meta property="og:description" content="A special Valentine’s surprise… will you click YES? 💖" />
<meta property="og:image" content="https://SJMRCappy.github.io/valentine/capybara-love.png" />
<meta property="og:type" content="website" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="capybara.png" type="image/png" />


  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', 'Comic Sans MS', cursive;
    }

    body {
      margin: 0;
      height: 100vh;
      background-image: url('capybara.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* soft pink overlay so text is readable */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 182, 193, 0.4);
      z-index: -1;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 420px;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 30px;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #yes:hover {
      transform: scale(1.08);
    }

    #no {
      position: fixed;
      background-color: #999;
      color: white;
    }

    .success {
      display: none;
      color: #ff4d6d;
      font-size: 22px;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <div class="container">
<p style="font-size: 1.2em; margin-bottom: 8px;">
  Hello Bullied Accountant 👋
</p>
<h1>Will you be my Valentine? 💖</h1>

    <div class="buttons">
      <button id="yes">Yes 💖</button>
      <button id="no">No 🙃</button>
    </div>

    <div class="success">
  <img src="capybara-love.png" alt="Happy Capybara" style="width: 180px; margin-bottom: 15px;">
  <div>
    You said yes!!! <br>
    Soooo 14th?? 🦫
  </div>
</div>

  <script>
    const yesBtn = document.getElementById('yes');
    const noBtn = document.getElementById('no');
    const question = document.getElementById('question');
    const successMsg = document.querySelector('.success');

    let yesCount = 0;

    function moveButton() {
      const padding = 20;
      const maxX = window.innerWidth - noBtn.offsetWidth - padding;
      const maxY = window.innerHeight - noBtn.offsetHeight - padding;

      const randomX = Math.random() * maxX;
      const randomY = Math.random() * maxY;

      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    // NO always escapes
    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('click', moveButton);
    noBtn.addEventListener('touchstart', moveButton);

    yesBtn.addEventListener('click', () => {
      yesCount++;

      if (yesCount === 1) {
        question.innerHTML = "Are you sure? 🥺💖";
        yesBtn.innerHTML = "Yes, I'm sure 💘";
        noBtn.innerHTML = "No 😳";
        moveButton();
      } else {
        question.style.display = 'none';
        document.querySelector('.buttons').style.display = 'none';
        successMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
